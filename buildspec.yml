version: 0.2

phases:
  install:
    commands:
      - yum install -y unzip
      - curl -O https://releases.hashicorp.com/terraform/1.6.6/terraform_1.6.6_linux_amd64.zip
      - unzip terraform_1.6.6_linux_amd64.zip
      - mv terraform /usr/bin/

  pre_build:
    commands:
      - echo "Checking files"
      - ls -la
      - cd main  
      - terraform init -reconfigure

  build:
    commands:
      - terraform plan
      - terraform destroy -auto-approve
